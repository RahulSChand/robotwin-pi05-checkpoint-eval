[program:robotwin-finalizer]
command=/workspace/robotwin_eval/run_sweep_finalizer.sh
directory=/workspace/robotwin_eval
autostart=false
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/robotwin_eval/logs/finalizer.log
redirect_stderr=true
stdout_logfile_maxbytes=0
