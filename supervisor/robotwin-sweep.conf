[program:robotwin-sweep]
command=/workspace/robotwin_eval/run_dual_gpu_sweep.sh
directory=/workspace/robotwin_eval
autostart=false
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/robotwin-sweep.log
redirect_stderr=true
stdout_logfile_maxbytes=0
